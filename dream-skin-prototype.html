<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dream Skin · 优化原型</title>
<style>
  /* ============================================================
     设计 Token（优化点①：统一设计系统，替换散落硬编码类）
     中性色使用 oklch，偏冷调以呼应“梦境/氛围”品牌个性
     ============================================================ */
  :root {
    /* 宿主外壳 */
    --host-bg:        oklch(0.20 0.012 280);
    --host-bg-2:      oklch(0.235 0.014 280);
    /* 面板表面（组件层） */
    --surface:        oklch(0.265 0.014 280);
    --surface-2:      oklch(0.30 0.016 280);
    --surface-hover:  oklch(0.34 0.018 280);
    /* 描边（用细线代替通用阴影，避免 AI 套路感） */
    --line:           oklch(1 0 0 / 0.10);
    --line-strong:    oklch(1 0 0 / 0.20);
    /* 文字（muted 已校验 ≥4.5:1 对比度，优化点③） */
    --text:           oklch(0.96 0.004 280);
    --text-muted:     oklch(0.74 0.012 280);
    --text-faint:     oklch(0.60 0.012 280);
    /* 语义色 */
    --danger:         oklch(0.62 0.19 25);
    --danger-hover:   oklch(0.55 0.20 25);
    /* 主题强调色（随选中主题切换） */
    --accent:         oklch(0.70 0.15 250);
    --accent-ink:     oklch(0.98 0 0);
    /* 间距（4px 基准节奏，变化间距制造层次） */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
    --s5: 20px; --s6: 24px; --s8: 32px;
    /* 圆角 */
    --r-sm: 8px; --r: 12px; --r-lg: 16px;
    /* 缓动：指数感，状态变化更“贵” */
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur: 320ms;

    --font: "Segoe UI", system-ui, -apple-system, "PingFang SC",
            "Microsoft YaHei", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--host-bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* 焦点可见性（优化点③：键盘用户知道焦点在哪） */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ============================================================
     三栏布局：宿主侧栏 | 插件面板 | 聊天预览
     ============================================================ */
  .app {
    display: grid;
    grid-template-columns: 60px 380px 1fr;
    height: 100vh;
  }

  /* ---------- 宿主侧栏（示意） ---------- */
  .host-rail {
    background: var(--host-bg);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--s4) 0;
    gap: var(--s2);
  }
  .rail-icon {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: var(--r-sm);
    color: var(--text-faint);
    cursor: pointer;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .rail-icon:hover { background: var(--surface); color: var(--text-muted); }
  .rail-icon.active {
    background: color-mix(in oklch, var(--accent) 22%, transparent);
    color: var(--accent);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .rail-icon svg { width: 20px; height: 20px; }

  /* ---------- 插件面板 ---------- */
  .panel {
    background: var(--host-bg-2);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .panel-head {
    padding: var(--s5) var(--s5) var(--s4);
    border-bottom: 1px solid var(--line);
  }
  .panel-title {
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -0.01em;
    display: flex; align-items: center; gap: var(--s2);
  }
  .panel-title .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 25%, transparent);
  }
  .panel-sub {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--text-faint);
  }

  .panel-body { flex: 1; overflow-y: auto; padding: var(--s4) var(--s5) var(--s8); }
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb {
    background: var(--line-strong); border-radius: 99px;
  }

  .view { display: none; }
  .view.active { display: block; animation: fade var(--dur) var(--ease); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- 按钮 ---------- */
  .btn {
    font: inherit; font-size: 13.5px; font-weight: 550;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    padding: 9px 14px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform 120ms var(--ease);
    color: var(--text);
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    width: 100%;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; border-color: var(--line-strong); color: var(--text-muted); }
  .btn-ghost:hover { background: var(--surface); color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: var(--danger-hover); }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; }

  .icon-btn {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border-radius: var(--r-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--dur) var(--ease);
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
  .icon-btn.danger:hover { background: color-mix(in oklch, var(--danger) 18%, transparent); color: var(--danger); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---------- 主题列表 ---------- */
  .theme-list { display: flex; flex-direction: column; gap: var(--s3); margin-top: var(--s4); }

  .theme-card {
    position: relative;
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: var(--s3);
    align-items: center;
    padding: var(--s3);
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
    cursor: pointer;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform 160ms var(--ease);
  }
  .theme-card:hover { border-color: var(--line-strong); transform: translateX(2px); }
  /* 激活态：用主题自带 accent（优化点②），而非写死蓝色 */
  .theme-card.active {
    border-color: var(--card-accent, var(--accent));
    background: color-mix(in oklch, var(--card-accent, var(--accent)) 12%, var(--surface));
    box-shadow: inset 3px 0 0 var(--card-accent, var(--accent));
  }
  .theme-card.active .thumb { box-shadow: 0 0 0 2px var(--card-accent, var(--accent)); }

  .thumb {
    width: 56px; height: 56px;
    border-radius: var(--r-sm);
    background-size: cover; background-position: center;
    flex-shrink: 0;
  }
  .theme-meta { min-width: 0; }
  .theme-name {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .theme-desc {
    font-size: 12px; color: var(--text-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 2px;
  }
  .theme-tags { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .tag {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
    padding: 2px 7px; border-radius: 99px;
    background: var(--surface-2); color: var(--text-muted);
    border: 1px solid var(--line);
  }
  .tag.dark { color: #cbd5ff; }
  .tag.light { color: #ffd9a8; }
  .accent-swatch {
    width: 11px; height: 11px; border-radius: 50%;
    border: 1px solid var(--line-strong);
  }
  .active-badge {
    display: none;
    position: absolute; top: -8px; right: 12px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    padding: 2px 8px; border-radius: 99px;
    background: var(--card-accent, var(--accent));
    color: var(--accent-ink);
  }
  .theme-card.active .active-badge { display: inline-block; }

  .card-actions { display: flex; gap: 2px; opacity: 0; transition: opacity var(--dur) var(--ease); }
  .theme-card:hover .card-actions, .theme-card:focus-within .card-actions { opacity: 1; }

  /* 内联删除确认条（优化点：替代原生 confirm） */
  .confirm-bar {
    grid-column: 1 / -1;
    display: none;
    align-items: center; justify-content: space-between;
    gap: var(--s3);
    margin-top: var(--s2); padding-top: var(--s3);
    border-top: 1px dashed var(--line-strong);
    font-size: 12.5px; color: var(--text-muted);
  }
  .theme-card.confirming .confirm-bar { display: flex; }
  .confirm-bar .row { display: flex; gap: var(--s2); }

  /* ---------- 空状态（优化点：有教育意义的引导，非一行灰字） ---------- */
  .empty {
    text-align: center;
    padding: var(--s8) var(--s4);
    border: 1px dashed var(--line-strong);
    border-radius: var(--r);
    margin-top: var(--s4);
  }
  .empty .glyph {
    width: 64px; height: 64px; margin: 0 auto var(--s4);
    border-radius: 18px;
    display: grid; place-items: center;
    background: radial-gradient(120% 120% at 30% 20%, color-mix(in oklch, var(--accent) 30%, transparent), transparent 70%);
    border: 1px solid var(--line);
  }
  .empty .glyph svg { width: 30px; height: 30px; color: var(--accent); }
  .empty h3 { font-size: 15px; font-weight: 600; }
  .empty p { font-size: 12.5px; color: var(--text-faint); margin: var(--s2) 0 var(--s4); line-height: 1.5; }

  /* ---------- 表单 ---------- */
  .field { margin-bottom: var(--s4); }
  .field > label {
    display: block; font-size: 12.5px; font-weight: 600;
    color: var(--text-muted); margin-bottom: var(--s2);
  }
  .input {
    width: 100%; font: inherit; font-size: 13.5px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    padding: 9px 12px;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .input::placeholder { color: var(--text-faint); }
  .input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 25%, transparent);
  }

  /* 拖拽区（优化点：核心操作的友好入口） */
  .dropzone {
    border: 1.5px dashed var(--line-strong);
    border-radius: var(--r);
    padding: var(--s6);
    text-align: center;
    color: var(--text-faint);
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: color-mix(in oklch, var(--accent) 8%, transparent);
    color: var(--text-muted);
  }
  .dropzone svg { width: 26px; height: 26px; margin-bottom: var(--s2); color: var(--accent); }
  /* 视觉隐藏但保留可访问性（键盘/读屏可达），替代原来的 hidden + JS .click() 隐藏按钮 */
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  .preview-img {
    width: 100%; height: 120px; object-fit: cover;
    border-radius: var(--r); border: 1px solid var(--line);
    margin-top: var(--s3);
  }

  /* ---------- 样式编辑器 ---------- */
  .tabs {
    display: flex; gap: 2px;
    border-bottom: 1px solid var(--line);
    margin: var(--s4) 0 var(--s4);
    overflow-x: auto;
  }
  .tab {
    font: inherit; font-size: 12.5px; font-weight: 550;
    padding: 7px 12px; white-space: nowrap;
    background: transparent; border: none; cursor: pointer;
    color: var(--text-faint);
    border-bottom: 2px solid transparent;
    transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .tab:hover { color: var(--text-muted); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .prop-group { margin-bottom: var(--s4); }
  .prop-group h4 {
    font-size: 12px; font-weight: 650; color: var(--text-muted);
    padding-bottom: var(--s2); margin-bottom: var(--s3);
    border-bottom: 1px solid var(--line);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .prop-row {
    display: grid; grid-template-columns: 84px 1fr;
    align-items: center; gap: var(--s3); margin-bottom: var(--s3);
  }
  .prop-row > label { font-size: 12.5px; color: var(--text-muted); }
  .prop-control { display: flex; align-items: center; gap: var(--s2); }

  /* 原生颜色选择器 + 透明度（优化点：不依赖 CDN，离线可用且自带 a11y） */
  input[type="color"] {
    width: 34px; height: 30px; padding: 0;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--surface); cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
  .color-val { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .range-val { font-family: var(--mono); font-size: 11px; color: var(--text-faint); width: 42px; text-align: right; }
  .toggle {
    display: flex; align-items: center; gap: var(--s2);
    padding: var(--s3); background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-sm); margin-bottom: var(--s4);
    font-size: 13px; font-weight: 550;
  }
  .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
  .area-hint { font-size: 12px; color: var(--text-faint); margin: var(--s3) 0 var(--s1); line-height: 1.5; }
  .prop-group.is-disabled { opacity: 0.45; pointer-events: none; }

  .css-preview {
    width: 100%; height: 132px; resize: none;
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    color: #9ae6b4; background: #0c0f14;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: var(--s3); margin-top: var(--s2);
  }

  .view-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--s4);
  }
  .view-head h2 { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .link-back {
    font: inherit; font-size: 13px; color: var(--text-muted);
    background: none; border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .link-back:hover { color: var(--text); }

  /* ============================================================
     右侧：聊天预览（展示插件“氛围感”价值 + 可读性遮罩）
     ============================================================ */
  .stage {
    position: relative;
    overflow: hidden;
    background: var(--stage-bg, var(--host-bg));
    transition: background 600ms var(--ease);
  }
  .stage::before {
    /* 背景图（由主题切换） */
    content: ""; position: absolute; inset: 0;
    background: var(--stage-art, none);
    background-size: cover; background-position: center;
    transition: background 600ms var(--ease);
  }
  .stage::after {
    /* 可读性遮罩：半透明 + 轻微模糊，合理而非滥用 */
    content: ""; position: absolute; inset: 0;
    background: color-mix(in oklch, var(--stage-tint, #0b0e14) 78%, transparent);
    backdrop-filter: blur(2px);
  }
  .stage-inner { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

  .stage-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--s4) var(--s6);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(12px);
    background: color-mix(in oklch, var(--stage-tint, #0b0e14) 40%, transparent);
  }
  .stage-top .who { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: var(--s2); }
  .stage-top .who .pill {
    font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
    background: color-mix(in oklch, var(--accent) 26%, transparent);
    color: var(--accent-ink); border: 1px solid color-mix(in oklch, var(--accent) 50%, transparent);
  }
  .stage-top .hint { font-size: 11.5px; color: var(--text-muted); }

  .chat { flex: 1; overflow-y: auto; padding: var(--s6); display: flex; flex-direction: column; gap: var(--s4); }
  .msg { max-width: 72%; padding: var(--s3) var(--s4); border-radius: 14px; font-size: 13.5px; line-height: 1.55; }
  .msg.user {
    align-self: flex-end;
    background: color-mix(in oklch, var(--accent) 28%, transparent);
    color: var(--text);
    border: 1px solid color-mix(in oklch, var(--accent) 45%, transparent);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: color-mix(in oklch, var(--stage-tint, #0b0e14) 55%, transparent);
    color: var(--text); border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .msg .role { font-size: 10.5px; font-weight: 700; color: var(--text-faint); margin-bottom: 4px; letter-spacing: 0.03em; }

  .composer {
    margin: var(--s4) var(--s6) var(--s6);
    display: flex; gap: var(--s3); align-items: center;
    padding: var(--s3);
    border-radius: 14px;
    background: color-mix(in oklch, var(--stage-tint, #0b0e14) 60%, transparent);
    border: 1px solid var(--line-strong);
    backdrop-filter: blur(14px);
  }
  .composer input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font: inherit; font-size: 13.5px;
  }
  .composer input::placeholder { color: var(--text-faint); }
  .composer .send {
    width: 34px; height: 34px; border-radius: 9px; border: none; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
  }
  .composer .send svg { width: 16px; height: 16px; }

  .demo-bar {
    position: absolute; top: var(--s4); right: var(--s4); z-index: 5;
    display: flex; gap: var(--s2);
  }
  .chip {
    font: inherit; font-size: 11.5px; font-weight: 550;
    padding: 5px 11px; border-radius: 99px; cursor: pointer;
    background: color-mix(in oklch, var(--stage-tint, #0b0e14) 60%, transparent);
    border: 1px solid var(--line-strong); color: var(--text-muted);
    backdrop-filter: blur(8px);
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<div class="app">

  <!-- 宿主侧栏示意 -->
  <nav class="host-rail" aria-label="主导航">
    <div class="rail-icon" title="首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
    </div>
    <div class="rail-icon" title="对话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-5A8 8 0 1 1 21 12z"/></svg>
    </div>
    <div class="rail-icon active" title="Dream Skin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5c2 2.5 2 5.5 0 8.5s-2 6 0 8.5M3.5 12c2.5-2 5.5-2 8.5 0s6 2 8.5 0"/></svg>
    </div>
    <div class="rail-icon" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1l-.4-2.6h-3.9l-.4 2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.6h3.9l.4-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z"/></svg>
    </div>
  </nav>

  <!-- 插件面板 -->
  <section class="panel" aria-label="Dream Skin 主题面板">
    <header class="panel-head">
      <div class="panel-title"><span class="dot"></span>Dream Skin</div>
      <div class="panel-sub">为聊天界面注入背景图与氛围主题</div>
    </header>

    <div class="panel-body">

      <!-- 列表视图 -->
      <div class="view active" id="view-list">
        <button class="btn btn-primary" id="add-open">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          添加主题
        </button>
        <div class="theme-list" id="theme-list"></div>
        <div class="empty" id="empty-state" style="display:none">
          <div class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5c2 2.5 2 5.5 0 8.5s-2 6 0 8.5"/></svg></div>
          <h3>还没有主题</h3>
          <p>添加一张你喜欢的背景图，<br/>Dream Skin 会为它生成协调的氛围主题。</p>
          <button class="btn btn-ghost" id="empty-add">创建第一个主题</button>
        </div>
      </div>

      <!-- 添加视图 -->
      <div class="view" id="view-add">
        <div class="view-head">
          <h2>添加主题</h2>
          <button class="link-back" data-back="list">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>返回
          </button>
        </div>
        <div class="field">
          <label for="new-name">主题名称</label>
          <input class="input" id="new-name" placeholder="例如：极光漂移" />
        </div>
        <div class="field">
          <label>背景图片</label>
          <label class="dropzone" id="dropzone" for="file-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0L8 8m4-4l4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            拖放图片到此处，或点击选择<br/>推荐 2560×1440 或更高
          </label>
          <input type="file" id="file-input" accept="image/*" class="sr-only" />
          <img class="preview-img" id="add-preview" style="display:none" alt="背景预览" />
        </div>
        <div id="editor-add"></div>
        <div style="display:flex; gap:var(--s2); margin-top:var(--s4)">
          <button class="btn btn-primary" id="save-new">保存主题</button>
        </div>
      </div>

      <!-- 编辑视图 -->
      <div class="view" id="view-edit">
        <div class="view-head">
          <h2>编辑主题</h2>
          <button class="link-back" data-back="list">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>返回
          </button>
        </div>
        <div class="field">
          <label>主题名称</label>
          <input class="input" id="edit-name" disabled />
        </div>
        <div class="field">
          <label>背景图片</label>
          <label class="preview-label" for="edit-file-input" title="点击或拖拽更换背景图片" style="cursor:pointer; display:block">
            <img class="preview-img" id="edit-preview" alt="背景预览" />
          </label>
          <input type="file" id="edit-file-input" accept="image/*" class="sr-only" />
        </div>
        <div id="editor-edit"></div>
        <div style="display:flex; gap:var(--s2); margin-top:var(--s4)">
          <button class="btn btn-primary" id="save-edit">保存更改</button>
        </div>
      </div>

    </div>
  </section>

  <!-- 聊天预览 -->
  <section class="stage" id="stage">
    <div class="demo-bar">
      <button class="chip" id="demo-empty">演示空状态</button>
      <button class="chip" id="demo-reset">重置数据</button>
    </div>
    <div class="stage-inner">
      <div class="stage-top">
        <div class="who"><span id="stage-name">Gothic Void Crusade</span><span class="pill" id="stage-mode">深色</span></div>
        <div class="hint">实时预览 · 应用主题后此处立即变化</div>
      </div>
      <div class="chat">
        <div class="msg assistant"><div class="role">助手</div>夜色已就位。试试切换左侧不同主题，感受聊天界面的氛围变化。</div>
        <div class="msg user"><div class="role">你</div>这个哥特深红的气质我喜欢，能再把侧边栏也染上一点吗？</div>
        <div class="msg assistant"><div class="role">助手</div>当然。在编辑面板里开启「左侧栏」自定义，取一个偏暗红的强调色即可。</div>
      </div>
      <div class="composer">
        <input placeholder="给 Dream Skin 说点什么…" aria-label="消息输入框" />
        <button class="send" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </section>

</div>

<script>
/* ===================== 数据 ===================== */
// 背景用纯 CSS 渐变模拟（完全离线，不加载任何外部图片）
const PRESET_BG = {
  gothic: "radial-gradient(120% 120% at 28% 18%, #2a0a18 0%, #160819 46%, #050207 100%), radial-gradient(85% 85% at 82% 88%, rgba(139,0,0,0.38), transparent 60%)",
  arina: "radial-gradient(120% 120% at 72% 12%, #ffe3f1 0%, #ffd3e8 42%, #e7c0ff 100%)",
  aurora: "radial-gradient(120% 120% at 18% 82%, #062a3f 0%, #0a3f50 40%, #04141f 100%), radial-gradient(90% 90% at 86% 14%, rgba(79,209,197,0.32), transparent 55%)"
};

let themes = [
  { id:"preset-gothic", name:"Gothic Void Crusade", desc:"深空哥特 · 暗红辉光", mode:"dark", accent:"#c0152f", accentInk:"#ffffff", bg:PRESET_BG.gothic },
  { id:"preset-arina",  name:"Arina Hashimoto",     desc:"梦幻粉彩 · 暖光",     mode:"light", accent:"#e8a0bf", accentInk:"#4a1a2e", bg:PRESET_BG.arina },
  { id:"aurora-drift",  name:"Aurora Drift",        desc:"极光 · 薄荷辉光",     mode:"dark", accent:"#4fd1c5", accentInk:"#04201d", bg:PRESET_BG.aurora }
];
let activeId = "preset-gothic";

/* ===================== 工具 ===================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const hexToRgb = h => { const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; };

/* ===================== 渲染列表 ===================== */
function renderList() {
  const list = $("#theme-list");
  $("#empty-state").style.display = themes.length ? "none" : "block";
  list.innerHTML = "";
  themes.forEach(t => {
    const card = document.createElement("div");
    card.className = "theme-card" + (t.id === activeId ? " active" : "");
    card.style.setProperty("--card-accent", t.accent);
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-pressed", t.id === activeId);
    card.setAttribute("aria-label", `${t.name}${t.id===activeId?"（使用中）":""}`);
    card.innerHTML = `
      <div class="thumb" style="background:${t.bg}"></div>
      <div class="theme-meta">
        <div class="theme-name">${t.name}</div>
        <div class="theme-desc">${t.desc}</div>
        <div class="theme-tags">
          <span class="tag ${t.mode}">${t.mode==="dark"?"深色":"浅色"}</span>
          <span class="accent-swatch" style="background:${t.accent}"></span>
        </div>
      </div>
      <div class="card-actions">
        <button class="icon-btn" data-act="edit" title="编辑样式" aria-label="编辑 ${t.name}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18 10l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
        </button>
        <button class="icon-btn danger" data-act="del" title="删除主题" aria-label="删除 ${t.name}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12M9 7V4h6v3M8 7l1 13h6l1-13"/></svg>
        </button>
      </div>
      <span class="active-badge">使用中</span>
      <div class="confirm-bar">
        <span>确定删除「${t.name}」？此操作不可撤销。</span>
        <div class="row">
          <button class="btn btn-ghost btn-sm" data-act="cancel">取消</button>
          <button class="btn btn-danger btn-sm" data-act="confirm-del">删除</button>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

/* ===================== 应用主题到预览 ===================== */
function applyStage(t) {
  const stage = $("#stage");
  stage.style.setProperty("--stage-art", t.bg);
  stage.style.setProperty("--stage-tint", t.mode === "dark" ? "#0b0e14" : "#1a1320");
  stage.style.setProperty("--accent", t.accent);
  stage.style.setProperty("--accent-ink", t.accentInk);
  $("#stage-name").textContent = t.name;
  $("#stage-mode").textContent = t.mode === "dark" ? "深色" : "浅色";
}

/* ===================== 样式编辑器（可复用） ===================== */
function buildEditor(mountId) {
  const mount = $("#"+mountId);
  const AREA_LABELS = {global:"全局",topBar:"顶部栏",leftSidebar:"左侧栏",chatArea:"聊天区",bottomBar:"底部栏"};
  const enabled = { global:true, topBar:false, leftSidebar:false, chatArea:false, bottomBar:false };
  let current = "global";
  mount.innerHTML = `
    <div class="tabs" role="tablist">
      ${["global","topBar","leftSidebar","chatArea","bottomBar"].map((t,i)=>
        `<button class="tab ${i===0?"active":""}" data-tab="${t}" role="tab">${AREA_LABELS[t]}</button>`).join("")}
    </div>
    <div id="${mountId}-toggle-wrap"></div>
    <div class="prop-group">
      <h4>字体</h4>
      <div class="prop-row"><label for="${mountId}-fc">颜色</label>
        <div class="prop-control">
          <input type="color" id="${mountId}-fc" value="#ffffff" aria-label="字体颜色" />
          <span class="color-val" id="${mountId}-fcv">#ffffff</span>
        </div></div>
    </div>
    <div class="prop-group">
      <h4>背景</h4>
      <div class="prop-row"><label for="${mountId}-bc">颜色</label>
        <div class="prop-control">
          <input type="color" id="${mountId}-bc" value="#000000" aria-label="背景颜色" />
          <span class="color-val" id="${mountId}-bcv">#000000</span>
        </div></div>
      <div class="prop-row"><label for="${mountId}-op">不透明度</label>
        <div class="prop-control">
          <input type="range" id="${mountId}-op" min="0" max="100" value="80" aria-label="不透明度" />
          <span class="range-val" id="${mountId}-opv">80%</span>
        </div></div>
    </div>
    <div class="prop-group">
      <h4>边框</h4>
      <div class="prop-row"><label for="${mountId}-boc">颜色</label>
        <div class="prop-control">
          <input type="color" id="${mountId}-boc" value="#333333" aria-label="边框颜色" />
          <span class="color-val" id="${mountId}-bocv">#333333</span>
        </div></div>
      <div class="prop-row"><label for="${mountId}-bw">宽度</label>
        <div class="prop-control">
          <input type="range" id="${mountId}-bw" min="0" max="10" value="1" aria-label="边框宽度" />
          <span class="range-val" id="${mountId}-bwv">1px</span>
        </div></div>
    </div>
    <div class="prop-group">
      <h4>CSS 预览</h4>
      <textarea class="css-preview" id="${mountId}-css" readonly aria-label="生成的 CSS 预览"></textarea>
    </div>`;

  // 当前区域启用开关（跟随 tab；全局无开关，始终生效）
  function renderToggle() {
    const wrap = $("#"+mountId+"-toggle-wrap", mount);
    if (current === "global") {
      wrap.innerHTML = `<p class="area-hint">全局为基准样式，始终生效。切换到具体区域可单独启用自定义。</p>`;
      $$(".prop-group", mount).forEach(g => g.classList.remove("is-disabled"));
    } else {
      wrap.innerHTML = `
        <div class="toggle">
          <input type="checkbox" id="${mountId}-enabled" ${enabled[current]?"checked":""} />
          <label for="${mountId}-enabled">启用「${AREA_LABELS[current]}」自定义样式</label>
        </div>`;
      $("#"+mountId+"-enabled", mount).addEventListener("change", e => {
        enabled[current] = e.target.checked;
        $$(".prop-group", mount).forEach(g => g.classList.toggle("is-disabled", !e.target.checked));
        $("#"+mountId+"-css",mount).value = gen();
      });
      $$(".prop-group", mount).forEach(g => g.classList.toggle("is-disabled", !enabled[current]));
    }
    $("#"+mountId+"-css",mount).value = gen();
  }
  // tab 切换
  $$(".tab", mount).forEach(tab => tab.addEventListener("click", () => {
    $$(".tab", mount).forEach(x => x.classList.remove("active"));
    tab.classList.add("active");
    current = tab.dataset.tab;
    renderToggle();
  }));
  // 颜色 / 滑块联动
  const bind = (id, valId, fmt) => {
    const el = $("#"+id, mount), v = $("#"+valId, mount);
    el.addEventListener("input", () => v.textContent = fmt(el.value));
  };
  bind(`${mountId}-fc`, `${mountId}-fcv`, v=>v);
  bind(`${mountId}-bc`, `${mountId}-bcv`, v=>v);
  bind(`${mountId}-boc`, `${mountId}-bocv`, v=>v);
  bind(`${mountId}-op`, `${mountId}-opv`, v=>v+"%");
  bind(`${mountId}-bw`, `${mountId}-bwv`, v=>v+"px");
  // 简单 CSS 预览生成（区域未启用时给提示，而非生成）
  const gen = () => {
    if (current !== "global" && !enabled[current]) {
      return `/* 「${AREA_LABELS[current]}」未启用，将使用默认样式 */`;
    }
    const fc=$("#"+mountId+"-fc",mount).value, bc=$("#"+mountId+"-bc",mount).value;
    const op=$("#"+mountId+"-op",mount).value, bw=$("#"+mountId+"-bw",mount).value;
    const [r,g,b]=hexToRgb(bc);
    return `html.dream-skin-active [data-area] {\n  color: ${fc};\n  background-color: rgba(${r}, ${g}, ${b}, ${(op/100).toFixed(2)});\n  border: ${bw}px solid ${bc};\n}`;
  };
  ["fc","bc","op","bw","boc"].forEach(k=>{
    const full = k==="boc"?`${mountId}-boc`:`${mountId}-${k}`;
    $("#"+full,mount).addEventListener("input", ()=> $("#"+mountId+"-css",mount).value = gen());
  });
  $("#"+mountId+"-css",mount).value = gen();
  renderToggle();
}

/* ===================== 视图切换 ===================== */
function show(view) {
  $$(".view").forEach(v => v.classList.remove("active"));
  $("#view-"+view).classList.add("active");
}

/* ===================== 事件 ===================== */
// 列表：激活 / 编辑 / 删除（事件委托）
$("#theme-list").addEventListener("click", e => {
  const card = e.target.closest(".theme-card");
  if (!card) return;
  const id = themes[$$(".theme-card").indexOf(card)]?.id;
  const act = e.target.closest("[data-act]")?.dataset.act;

  if (act === "edit") {
    const t = themes.find(x=>x.id===id);
    editTargetId = id;
    $("#edit-name").value = t.name;
    const ep = $("#edit-preview");
    if (t.img) { ep.src = t.img; ep.style.background = "none"; }
    else { ep.removeAttribute("src"); ep.style.background = t.bg; }
    show("edit");
    return;
  }
  if (act === "del") { card.classList.add("confirming"); return; }
  if (act === "cancel") { card.classList.remove("confirming"); return; }
  if (act === "confirm-del") {
    themes = themes.filter(x=>x.id!==id);
    if (activeId === id) activeId = themes[0]?.id;
    if (activeId) applyStage(themes.find(x=>x.id===activeId));
    renderList();
    return;
  }
  // 点击卡片本体 → 激活
  if (!act) {
    activeId = id;
    applyStage(themes.find(x=>x.id===id));
    renderList();
  }
});
$("#theme-list").addEventListener("keydown", e => {
  if ((e.key==="Enter"||e.key===" ") && e.target.classList.contains("theme-card")) {
    e.preventDefault();
    activeId = themes[$$(".theme-card").indexOf(e.target)]?.id;
    if (activeId) { applyStage(themes.find(x=>x.id===activeId)); renderList(); }
  }
});

// 打开添加
$("#add-open").addEventListener("click", () => { $("#new-name").value=""; $("#add-preview").style.display="none"; pendingImg = null; show("add"); });
$("#empty-add").addEventListener("click", () => { $("#new-name").value=""; show("add"); });
// 返回
$$("[data-back]").forEach(b => b.addEventListener("click", () => show(b.dataset.back)));

// 拖拽区
let pendingImg = null;        // 待保存的上传图片（添加视图）
let editTargetId = null;      // 编辑视图当前主题 id

const dz = $("#dropzone"), fi = $("#file-input");
// 点击由 <label for="file-input"> 原生处理，不再用隐藏 input + JS .click()
fi.addEventListener("change", () => { if (fi.files[0]) showPreview(fi.files[0], "add-preview"); });
["dragenter","dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("drag"); }));
["dragleave","drop"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("drag"); }));
dz.addEventListener("drop", e => { const f=e.dataTransfer.files[0]; if (f) showPreview(f, "add-preview"); });

// 编辑视图：点击预览图（label）更换背景；拖拽亦可
const efi = $("#edit-file-input");
const epLabel = $("#edit-preview").closest("label");
function applyEditImage(f) {
  if (!f || !editTargetId) return;
  const url = URL.createObjectURL(f);
  const t = themes.find(x=>x.id===editTargetId);
  t.img = url; t.bg = 'url("'+url+'")';
  const ep = $("#edit-preview");
  ep.src = url; ep.style.background = "none";
  applyStage(t);
}
efi.addEventListener("change", () => applyEditImage(efi.files[0]));
["dragenter","dragover"].forEach(ev => epLabel.addEventListener(ev, e => { e.preventDefault(); epLabel.classList.add("drag"); }));
["dragleave","drop"].forEach(ev => epLabel.addEventListener(ev, e => { e.preventDefault(); epLabel.classList.remove("drag"); }));
epLabel.addEventListener("drop", e => { const f=e.dataTransfer.files[0]; if (f) applyEditImage(f); });

function showPreview(file, targetId) {
  const url = URL.createObjectURL(file);
  pendingImg = url;
  const img = $("#"+targetId);
  img.src = url; img.style.display="block";
}

// 保存新主题
$("#save-new").addEventListener("click", () => {
  const name = $("#new-name").value.trim();
  if (!name) { $("#new-name").focus(); $("#new-name").style.borderColor="var(--danger)"; return; }
  const bgVal = pendingImg ? 'url("'+pendingImg+'")' : PRESET_BG.aurora;
  const t = { id:"theme-"+Date.now(), name, desc:"自定义主题", mode:"dark", accent:"#7c8cff", accentInk:"#fff", bg: bgVal, img: pendingImg };
  pendingImg = null;
  themes.push(t); activeId = t.id; applyStage(t); renderList(); show("list");
});
// 保存编辑
$("#save-edit").addEventListener("click", () => show("list"));

// demo 控制
$("#demo-empty").addEventListener("click", () => {
  themes = []; activeId = null;
  $("#stage-name").textContent = "无主题"; $("#stage-mode").textContent = "—";
  $("#stage").style.setProperty("--stage-art","none");
  renderList();
});
$("#demo-reset").addEventListener("click", () => {
  location.reload();
});

/* ===================== 初始化 ===================== */
buildEditor("editor-add");
buildEditor("editor-edit");
renderList();
applyStage(themes.find(t=>t.id===activeId));
</script>
</body>
</html>
